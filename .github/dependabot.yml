version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    allow:
     - dependency-name: "production"
       update-types:
        - "version-update:semver-major"
        - "version-update:semver-minor"
        - "version-update:semver-patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"